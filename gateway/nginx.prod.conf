# gateway/nginx.prod.conf — plain-HTTP front door (NO ssl directives here).
# External TLS proxy terminates HTTPS and forwards to this gateway's port 80.
# supabase-js talks to ONE base URL; Kong-style prefix stripping maps each
# path to its service. CORS mirrors .dev/nginx.conf so browsers pass preflight.
#
# MICROCACHE (hot read URLs): dozens of phones poll the leaderboard every 5s
# during the fair. GET /rest/v1/* 200s are cached for 5s (one upstream query
# per stampede), stale served while revalidating. Auth routes and writes are
# NEVER cached. Key includes apikey+Authorization so sessions can't leak
# across users (all SELECT RLS here is public-read anyway — belt & braces).
# Observe: curl -I ... | grep -i x-microcache  (MISS -> HIT -> STALE?)
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m
                 max_size=100m inactive=60s use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "$http_access_control_request_method" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age "86400" always;
            return 204;
        }
        proxy_pass http://auth:9999/;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        # sessions must never be cached (default: nothing cached here)
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "$http_access_control_request_method" always;
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age "86400" always;
            return 204;
        }
        proxy_pass http://rest:3000/;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Profile" always;

        # --- microcache: GET/HEAD 200s, 5s TTL ---------------------------
        proxy_cache api;
        proxy_cache_key "$scheme://$host$request_uri|$http_apikey|$http_authorization";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Microcache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
