# =============================================================================
# Community Quest — PROD stack (ephemeral fair backend: runs for hours, then off)
# 4 services: web (static) + Postgres + PostgREST + username auth service.
# No gateway here: a CDN/proxy on ANOTHER system routes to the published
# ports below (see nginx-cdn.conf.example). TLS terminates there as well.
#
# Ports listen on ALL interfaces (the CDN box must reach them) — firewall
# everything else. `db` is not published (admin via exec).
#
# Seed: ./seed/stands.csv (required) + ./seed/rewards.csv (required,
# header-only allowed) are loaded by Postgres init on EMPTY ./data/db.
# Reseed = down + rm -rf ./data/db + up (DESTRUCTIVE).
#
# Boot:
#   SITE_URL=https://feria.example.com ./deploy-keys.sh
#   docker compose --env-file .env.prod up -d --build
# Check (direct to published ports):
#   curl -s http://localhost:9999/health
#   curl -s -H "apikey: $ANON" http://localhost:3000/communities?select=name
# psql:
#   docker compose --env-file .env.prod exec db psql -U postgres
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      # Leídas por 71_organizer_seed.sh en la inicializacion. Sin ellas el
      # arranque falla a proposito: un evento que no se puede administrar es
      # peor que uno que no arranca, porque el problema aparece el dia de la feria.
      ORGANIZER_USERNAME: ${ORGANIZER_USERNAME:?ORGANIZER_USERNAME is required (run deploy-keys.sh)}
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:?ORGANIZER_PASSWORD is required (run deploy-keys.sh)}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./supabase/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./seed:/seed:ro
    healthcheck:
      # Healthy only once Postgres answers AND the whole init chain finished
      # (99_init_complete.sh). Without the second condition, an init aborted by
      # a missing/malformed seed CSV is masked by the restart policy: the db
      # comes back "healthy" with empty tables and every login fails with
      # invalid_credentials. The marker path is PGDATA + /.init_complete; keep
      # it in sync with PGDATA above if that ever changes.
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost && test -f /var/lib/postgresql/data/pgdata/.init_complete"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  auth:
    build: ./auth
    ports:
      - "${AUTH_PORT:-9999}:9999"
    depends_on:
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 5
    environment:
      PGRST_URL: http://rest:3000
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      ACCESS_TTL: 43200
      REFRESH_TTL: 172800
      RATE_LIMIT_MAX: 20
      RATE_LIMIT_WINDOW: 300
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    ports:
      - "${REST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env.prod}
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY}
    container_name: community-quest
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
