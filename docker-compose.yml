# =============================================================================
# PremiosFeria — PROD stack (ephemeral fair backend: runs for hours, then off)
# App + Postgres + PostgREST + username auth service behind a plain-HTTP
# nginx gateway with microcache on hot reads. An EXTERNAL TLS proxy terminates
# HTTPS and forwards Host + X-Forwarded-Proto to gateway:80. No certs here.
#
# Persistence: bind volumes only (./data/db, plus ro file binds). No named
# volumes. Wipe prod DB with: docker compose --env-file .env.prod down
# then rm -rf ./data/db   (DESTRUCTIVE — init + seed re-run on next up).
#
# Boot:
#   cp .env.prod.example .env.prod   # then fill secrets (keygen cmds inside)
#   docker compose --env-file .env.prod up -d --build
# Check:
#   curl -s http://localhost:8080/auth/v1/health
#   curl -s -H "apikey: $ANON" http://localhost:8080/rest/v1/communities?select=name
# psql:
#   docker compose --env-file .env.prod exec db psql -U postgres
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./supabase/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth
    depends_on:
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 5
    environment:
      PGRST_URL: http://rest:3000
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      ACCESS_TTL: 43200
      REFRESH_TTL: 172800
      RATE_LIMIT_MAX: 20
      RATE_LIMIT_WINDOW: 300
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env.prod}
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY}
    container_name: feriapoints
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    depends_on:
      - rest
      - auth
      - web
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  bootstrap:
    image: postgres:16-alpine
    command: ["sh", "/srv/bootstrap.sh"]
    volumes:
      - ./supabase/bootstrap:/srv:ro
      - ./seed:/seed:ro
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      AUTH_URL: http://auth:9999/health
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    restart: "no"
