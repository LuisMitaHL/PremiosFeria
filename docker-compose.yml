# =============================================================================
# PremiosFeria — PROD stack
# App + minimal self-hosted Supabase (db / auth / rest / realtime) behind a
# plain-HTTP nginx gateway. An EXTERNAL TLS proxy terminates HTTPS and
# forwards Host + X-Forwarded-Proto to gateway:80. No certs in this file.
#
# Persistence: bind volumes only (./data/db, plus ro file binds). No named
# volumes. Wipe prod DB with: docker compose --env-file .env.prod down
# then rm -rf ./data/db   (DESTRUCTIVE — init + seed re-run on next up).
#
# Boot:
#   cp .env.prod.example .env.prod   # then fill secrets (keygen cmds inside)
#   docker compose --env-file .env.prod up -d --build
# Check:
#   curl -s http://localhost:8080/auth/v1/health
#   curl -s -H "apikey: $ANON" http://localhost:8080/rest/v1/communities?select=name
# psql:
#   docker compose --env-file .env.prod exec db psql -U postgres
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./supabase/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 5
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL:?set SITE_URL in .env.prod}
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth: GoTrue creates some types unqualified; without this
      # they land in public and later migrations referencing auth.* fail.
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      GOTRUE_JWT_ISSUER: ${SITE_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "true"
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    restart: unless-stopped

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.34.47
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer $${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?16-char key, see .env.prod.example}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?64+-char key, see .env.prod.example}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ANON_KEY: ${ANON_KEY:?set ANON_KEY in .env.prod}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?set VITE_SUPABASE_URL in .env.prod}
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${ANON_KEY}
    container_name: feriapoints
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    depends_on:
      - rest
      - auth
      - realtime
      - web
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  bootstrap:
    image: postgres:16-alpine
    command: ["sh", "/srv/bootstrap.sh"]
    volumes:
      - ./supabase/bootstrap:/srv:ro
      - ./seed:/seed:ro
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      AUTH_URL: http://auth:9999/health
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    restart: "no"
